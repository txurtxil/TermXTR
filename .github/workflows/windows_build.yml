# TermXTR — build de escritorio Windows.
# Tag v* : compila y adjunta el zip a la release de Android (la crea si
# no existe). workflow_dispatch: misma build para probar sin etiquetar
# (sube el zip como artifact del run; NO toca releases).
name: windows_build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Dependencias
        run: flutter pub get

      - name: Compilar (release)
        run: flutter build windows --release

      # El exe enlaza contra el runtime de Visual C++ (MSVCP140...), que
      # existe en el runner pero NO en un Windows limpio. Se copian al
      # Release para empaquetarlos junto al resto de DLL en lib/.
      - name: Incluir runtime de Visual C++
        shell: pwsh
        run: |
          $rel = "build/windows/x64/runner/Release"
          foreach ($dll in @("msvcp140.dll", "vcruntime140.dll", "vcruntime140_1.dll")) {
            $src = "C:\Windows\System32\$dll"
            if (Test-Path $src) { Copy-Item $src $rel } else { Write-Host "AVISO: no esta $dll" }
          }

      # v2.17.1: estructura ordenada del zip portable. Los DLL (incluido
      # flutter_windows.dll) viven en lib/ y el exe los carga por
      # delay-load (main.cpp registra el directorio al arrancar).
      - name: Empaquetar zip ordenado
        shell: pwsh
        run: |
          $rel = "build/windows/x64/runner/Release"
          $ref = ($env:GITHUB_REF_NAME -replace '/', '-')
          $dest = "termxtr-windows-$ref"
          New-Item -ItemType Directory -Path $dest, "$dest\lib", "$dest\log" -Force | Out-Null
          Copy-Item "$rel\linux_container.exe" "$dest\TermXTR.exe"
          Copy-Item "$rel\data" -Recurse "$dest\data"
          # v2.17.9: flutter_windows.dll + TODOS los *_plugin.dll -> lib/
          # (delay-load registrado en CMakeLists; main.cpp anade lib/ al
          # search order antes de que se resuelvan). En v2.17.7- faltaban
          # en el zip (implicitos, raiz) y en v2.17.8 iban en la raiz;
          # ahora el exe queda limpio: solo VC runtime junto a el.
          Copy-Item "$rel\flutter_windows.dll" "$dest\lib"
          Get-ChildItem "$rel\*_plugin.dll" | Copy-Item -Destination "$dest\lib"
          # runtime de Visual C++ -> RAIZ (NO es delay-loadable: importa
          # simbolos de datos, LNK1194; el loader lo necesita antes de
          # main(), en la init del proceso)
          foreach ($dll in @("msvcp140.dll", "vcruntime140.dll", "vcruntime140_1.dll")) {
            Copy-Item "$rel\$dll" "$dest"
          }
          @"
          TermXTR (Windows portable)
          ==========================
          TermXTR.exe : la aplicacion (doble click)
          *.dll (raiz) : runtime de Visual C++ (NO mover; Windows lo carga
                         desde la carpeta del exe)
          lib\        : motor Flutter + DLL de plugins (NO mover; el exe
                        los carga desde ahi por delay-load)
          data\       : recursos de Flutter
          log\        : logs de la aplicacion

          Al ser portable y no firmada, Windows SmartScreen puede avisar la
          primera vez: "Mas informacion" -> "Ejecutar de todas formas".
          "@ | Out-File -Encoding utf8 "$dest\LEEME.txt"
          $zip = "$dest.zip"
          Compress-Archive -Path $dest -DestinationPath $zip
          "ZIP=$zip" >> $env:GITHUB_OUTPUT

      - name: Subir zip como artifact
        uses: actions/upload-artifact@v4
        with:
          name: termxtr-windows
          path: termxtr-windows-*.zip

      - name: Adjuntar zip a la release (solo tags)
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $zip = Get-Item "termxtr-windows-*.zip"
          gh release create $tag --title "$tag" 2>$null
          gh release upload $tag $zip --clobber
