name: linux_container
description: "TermXTR: terminal SSH/SFTP para Android con editor integrado, grabadora y gestion de hosts."
publish_to: 'none'
version: 2.5.0+10

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  path_provider: ^2.1.3
  cupertino_icons: ^1.0.8
  xterm: ^4.0.0
  flutter_pty: ^0.4.2
  dartssh2: ^3.3.1
  flutter_secure_storage: ^11.0.0
  shared_preferences: ^2.2.3
  file_selector: ^1.0.3
  share_plus: ^13.3.0
  cryptography: ^2.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
